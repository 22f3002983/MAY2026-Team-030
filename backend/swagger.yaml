openapi: 3.0.0
info:
  title: Niwaas RWA Management API
  description: >
    REST API for Niwaas — a residential welfare association (RWA) management
    platform covering complaints, vendors, dues, notices, emergency alerts,
    visitors, amenities, home services, electricity bills, society funds,
    document requests, profile-update requests, self-service profile edits,
    the flat directory, and the AI navigation assistant.
  version: "1.1.0"
servers:
  - url: http://localhost:5000
    description: Local development server


tags:
  - name: auth
    description: Registration, login/logout, session, invites and onboarding
  - name: complaints
    description: Resident complaints and vendor assignment
  - name: vendors
    description: Society-empanelled vendor directory
  - name: notices
    description: Secretary-posted notices/announcements
  - name: dues
    description: Monthly maintenance dues and receipts
  - name: emergency
    description: Emergency alert broadcasts
  - name: visitors
    description: Visitor pre-registration and gate check-in/out
  - name: amenities
    description: Amenity catalog and bookings
  - name: summary
    description: Role-specific dashboard summaries
  - name: notifications
    description: In-app notifications
  - name: service-requests
    description: Home Services — resident-booked personal vendor jobs
  - name: electricity-bills
    description: Society-wide monthly electricity bills
  - name: funds
    description: Society fund balances, split configuration and ledger
  - name: document-requests
    description: Resident document requests (NOC, receipts, etc.)
  - name: profile-requests
    description: Resident profile-update approval workflow
  - name: profile
    description: Resident self-service profile edits (no approval required)
  - name: flats
    description: Flat directory and block lookups
  - name: ai-assistant
    description: AI navigation/help chatbot


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Flask-Login session cookie set on successful /api/auth/login


  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Message:
      type: object
      properties:
        message:
          type: string


  responses:
    BadRequest:
      description: Invalid or missing input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not logged in
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Logged in but not permitted for this role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Request conflicts with existing state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }


security:
  - cookieAuth: []


paths:


  # ── auth ──────────────────────────────────────────────────────
  /api/auth/ping:
    get:
      tags: [auth]
      summary: Health check for the auth blueprint
      security: []
      responses:
        '200': { description: OK }


  /api/auth/register:
    post:
      tags: [auth]
      summary: Register a new user (resident, secretary or security)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role, name]
              properties:
                email: { type: string }
                password: { type: string }
                role: { type: string, enum: [resident, secretary, security] }
                name: { type: string }
                phone: { type: string }
                flat_id: { type: string }
                occupant_type: { type: string, enum: [owner, tenant] }
                household_size: { type: integer }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }


  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        A resident's FIRST login also requires the invite_code the
        secretary gave them (see POST /api/auth/invite), to prove they're
        the person the secretary intended to invite. Once verified, the
        resident is flipped to onboarded and never needs the invite code
        again on subsequent logins. There is no separate onboarding
        endpoint — this single route handles both first-time and regular
        login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                invite_code: { type: string, description: Required only on a resident's first login }
      responses:
        '200': { description: Login successful, session cookie set }
        '400': { description: "Invalid input, or invite_code_required/invalid/expired on a resident's first login" }
        '401': { description: Invalid email or password }
        '403': { description: Account deactivated }


  /api/auth/logout:
    post:
      tags: [auth]
      summary: Log out and clear the session
      responses:
        '200': { $ref: '#/components/responses/BadRequest' }


  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the current logged-in user
      responses:
        '200': { description: Current user }
        '302': { description: Not authenticated — redirected to login }


  /api/auth/residents:
    get:
      tags: [auth]
      summary: List all residents (secretary only)
      responses:
        '200': { description: List of residents }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/auth/invite:
    post:
      tags: [auth]
      summary: (Re)generate an invite code for a resident (secretary only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resident_id]
              properties:
                resident_id: { type: string }
      responses:
        '200': { description: New invite code issued }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Password updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Current password incorrect }


  /api/auth/change-email:
    post:
      tags: [auth]
      summary: Change the current user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, current_password]
              properties:
                new_email: { type: string, format: email }
                current_password: { type: string }
      responses:
        '200': { description: Email updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Current password incorrect }
        '409': { description: Email already in use }


  # ── complaints ────────────────────────────────────────────────
  /api/complaints:
    post:
      tags: [complaints]
      summary: Raise a complaint (resident only)
      description: |
        If title+category match an existing open/in_progress issue, this
        joins that issue instead of creating a new one (see
        /api/complaints/check-duplicates for a pre-submit AI check that
        catches near-duplicates worded differently). The server also
        populates ai_suggested_category, ai_suggested_priority and
        ai_suggested_description on the resulting issue via an LLM call —
        these are advisory only and never override the submitted category
        or priority.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-1:** As a resident, I want to submit a complaint online and see its status so that I do not have to call the secretary multiple times.
        - **US-11:** As a secretary, I want to log every incoming complaint into one system so that no complaint gets missed.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category, type]
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string, enum: [plumbing, electrical, cleaning, carpentry, security, gardening, pest_control, other] }
                type: { type: string, enum: [personal, common_area] }
                priority: { type: string, enum: [high, medium, low] }
      responses:
        '201': { description: Complaint raised }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [complaints]
      summary: List complaints (resident sees own, secretary sees all)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-1:** As a resident, I want to submit a complaint online and see its status so that I do not have to call the secretary multiple times.
        - **US-13:** As a secretary, I want to track each complaint status (open/in-progress/resolved) until the worker confirms completion.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
      responses:
        '200': { description: List of complaints }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/check-duplicates:
    post:
      tags: [complaints]
      summary: AI check for likely-duplicate open issues before raising a new one (resident only)
      description: |
        Resident-triggered (a button, not called as-you-type). Compares the
        given title/description against up to 15 open/in_progress issues in
        the same category (excluding ones the resident already reports on)
        using an LLM, and returns which existing issue ids look like the
        same underlying problem — even when worded completely differently.
        Returns an empty list if no OPENROUTER_API_KEY is configured, the
        call fails, or nothing matches; this is advisory only and never
        blocks raising a new issue.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-11:** As a secretary, I want to log every incoming complaint into one system so that no complaint gets missed across multiple channels.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category]
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string, enum: [plumbing, electrical, cleaning, carpentry, security, gardening, pest_control, other] }
      responses:
        '200':
          description: Matching issue ids (possibly empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/suggest:
    post:
      tags: [complaints]
      summary: Live AI category suggestion while describing a complaint (resident only)
      description: |
        Advisory only, does not persist anything. Returns category: null
        if no OPENROUTER_API_KEY is configured, the call fails, or the
        description is empty.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-1:** As a resident, I want to submit a complaint online and get help picking the right category.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
      responses:
        '200':
          description: Suggested category (nullable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { type: string, enum: [plumbing, electrical, cleaning, carpentry, security, gardening, pest_control, other], nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/suggest-priority:
    post:
      tags: [complaints]
      summary: Live AI priority suggestion while describing a complaint (resident only)
      description: |
        Advisory only, does not persist anything. Returns priority: null
        if no OPENROUTER_API_KEY is configured, the call fails, or the
        title/description is empty.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-1:** As a resident, I want to submit a complaint online and get help flagging how urgent it is.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, category]
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string, enum: [plumbing, electrical, cleaning, carpentry, security, gardening, pest_control, other] }
      responses:
        '200':
          description: Suggested priority (nullable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  priority: { type: string, enum: [high, medium, low], nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/{complaint_id}:
    get:
      tags: [complaints]
      summary: Get a single complaint
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-1:** As a resident, I want to submit a complaint online and see its status.
        - **US-13:** As a secretary, I want to track each complaint status until the worker confirms completion.
       
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Complaint detail }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [complaints]
      summary: Delete a complaint — also deletes the issue if this was the only report on it
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Complaint deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/complaints/{complaint_id}/retry-ai:
    post:
      tags: [complaints]
      summary: Retry AI category/priority suggestions for an issue (secretary only)
      description: |
        Only fills in whichever of ai_suggested_category / ai_suggested_priority
        is still missing — does not overwrite a suggestion that's already set.
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Suggestions updated (or left as-is if already present) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/complaints/{complaint_id}/merge:
    post:
      tags: [complaints]
      summary: Merge a duplicate issue into another (secretary only)
      description: |
        Moves every report from the "other" issue onto the primary
        (complaint_id in the path) and deletes the other issue. Accepts
        either a CommunityIssue id or a Complaint (report) id for both.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-11:** As a secretary, I want to log every incoming complaint into one system.
        - **US-13:** As a secretary, I want to track each complaint status until resolved.
       
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string }, description: The surviving/primary issue }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [other_issue_id]
              properties:
                other_issue_id: { type: string, description: The issue to merge in and delete }
      responses:
        '200': { description: Issues merged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/complaints/{complaint_id}/assign:
    patch:
      tags: [complaints]
      summary: Assign a vendor to a complaint (secretary only)
      description: |
        Sends the assigned vendor a Telegram notification with the flat
        number, building name, complaint details, and scheduled visit
        window (channel switched from WhatsApp to Telegram in Sprint 1,
        per user feedback wanting business/society chats kept separate
        from personal WhatsApp — see US-17).

        US-18 (an explicit Yes/No accept/reject reply) reflects a changed
        design implementation: vendors work directly for the society, so
        an assigned job is expected to be accepted; if a vendor can't take
        it, that's handled offline and the job is reassigned via this
        same endpoint.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-12:** As a secretary, I want to assign a complaint to a specific worker from a saved contacts list so that I do not have to search for the right number manually.
        - **US-17:** As a plumber, I want to receive a Telegram notification whenever a new job is assigned to me, including flat number, building name, complaint details, scheduled visit time, and expected deadline.
        - **US-18 (changed design implementation):** As a plumber, I want to accept or reject an assigned job via a Yes/No response — see description above.
       
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id]
              properties:
                vendor_id: { type: string }
                vendor_start_time: { type: string, format: date-time, description: "Optional — ISO 8601 UTC instant (e.g. from JS toISOString())" }
                vendor_end_time: { type: string, format: date-time, description: "Optional — ISO 8601 UTC instant" }
      responses:
        '200': { description: Vendor assigned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/{complaint_id}/status:
    patch:
      tags: [complaints]
      summary: Update complaint status
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-13:** As a secretary, I want to track each complaint status (open/in-progress/resolved) until the worker confirms completion so that I have visibility into unresolved issues.
       
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, resolved, closed] }
      responses:
        '200': { description: Status updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/{complaint_id}/feedback:
    patch:
      tags: [complaints]
      summary: Submit feedback on a resolved complaint (resident only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-8:** As a resident, I want to give quick feedback or a rating after a complaint is resolved so that the secretary knows whether the work was actually done properly.
       
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback_rating]
              properties:
                feedback_rating: { type: integer, minimum: 1, maximum: 5 }
                feedback_comment: { type: string }
      responses:
        '200': { description: Feedback submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/complaints/{complaint_id}/description:
    patch:
      tags: [complaints]
      summary: Edit the description of your own complaint (resident only)
      parameters:
        - { name: complaint_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
      responses:
        '200': { description: Description updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── vendors ───────────────────────────────────────────────────
  /api/vendors:
    get:
      tags: [vendors]
      summary: List vendors
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, default: active } }
      responses:
        '200': { description: List of vendors }
    post:
      tags: [vendors]
      summary: Add a vendor (secretary only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, category]
              properties:
                name: { type: string }
                phone: { type: string }
                category: { type: string, enum: [plumbing, electrical, cleaning, carpentry, security, gardening, pest_control, other] }
                description: { type: string }
                working_hours: { type: string }
                is_salaried: { type: boolean }
                salary: { type: number }
      responses:
        '201': { description: Vendor added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/vendors/{vendor_id}:
    get:
      tags: [vendors]
      summary: Get a single vendor
      parameters:
        - { name: vendor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vendor detail }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [vendors]
      summary: Edit a vendor (secretary only)
      parameters:
        - { name: vendor_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                category: { type: string }
                description: { type: string }
                working_hours: { type: string }
                status: { type: string, enum: [active, inactive] }
                is_salaried: { type: boolean }
                salary: { type: number }
      responses:
        '200': { description: Vendor updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [vendors]
      summary: Remove a vendor (secretary only)
      parameters:
        - { name: vendor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vendor removed }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/vendors/{vendor_id}/toggle:
    patch:
      tags: [vendors]
      summary: Toggle a vendor between active and inactive (secretary only)
      parameters:
        - { name: vendor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Vendor status toggled }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/vendors/pay-salaries/preview:
    post:
      tags: [vendors]
      summary: Dry-run a salary payment across salaried vendors (secretary only)
      description: |
        Shows exactly which fund(s) the payment would come from — operating
        first, then contingency, then sinking if still short — without
        writing anything to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_ids]
              properties:
                vendor_ids: { type: array, items: { type: string } }
      responses:
        '200': { description: Fund breakdown for the proposed payment, including any shortfall }
        '400': { description: Missing vendor_ids, unknown vendor, non-salaried vendor, or inactive vendor }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Vendor not found }


  /api/vendors/pay-salaries:
    post:
      tags: [vendors]
      summary: Pay one or more salaried vendors (secretary only)
      description: |
        Recomputes the same fallback plan the preview shows and executes
        it: draws from operating first, then contingency, then sinking if
        needed, splitting a single vendor's salary across funds if one
        runs out mid-payment. Every draw is written to the funds ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_ids]
              properties:
                vendor_ids: { type: array, items: { type: string } }
      responses:
        '201': { description: Vendors paid }
        '400': { description: Missing vendor_ids, unknown/non-salaried/inactive vendor, or insufficient funds across all three funds }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Vendor not found }


  # ── notices ───────────────────────────────────────────────────
  /api/notices:
    get:
      tags: [notices]
      summary: List active notices
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-3:** As a resident, I want to receive advance notification about upcoming maintenance so that I can plan my day.
        - **US-5:** As a resident, I want to see all society announcements in one place so that I do not miss updates buried in WhatsApp.
       
      parameters:
        - { name: tag, in: query, schema: { type: string } }
        - { name: relevance, in: query, schema: { type: string } }
      responses:
        '200': { description: List of notices }
    post:
      tags: [notices]
      summary: Post a notice (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-3:** As a secretary, I want to notify residents about upcoming maintenance work near their flat.
        - **US-5:** As a secretary, I want to post society announcements in one place instead of a crowded WhatsApp group.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, expiry_date]
              properties:
                title: { type: string }
                description: { type: string }
                tag: { type: string, enum: [General, Maintenance, Security, Event, Urgent] }
                priority: { type: string, enum: [high, medium, low] }
                relevance: { type: string }
                expiry_date: { type: string, format: date }
      responses:
        '201': { description: Notice posted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/notices/{notice_id}:
    get:
      tags: [notices]
      summary: Get a single notice
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-3:** As a resident, I want to receive advance notification about upcoming maintenance.
        - **US-5:** As a resident, I want to see all society announcements in one place.
       
      parameters:
        - { name: notice_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Notice detail }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [notices]
      summary: Edit a notice — title, description, tag, priority, relevance, expiry_date (secretary only)
      description: |
        Editing expiry_date forward re-activates a previously expired
        notice automatically.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-3:** As a secretary, I want to correct or update a notice after posting it.
       
      parameters:
        - { name: notice_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                tag: { type: string }
                priority: { type: string }
                relevance: { type: string }
                expiry_date: { type: string, format: date }
      responses:
        '200': { description: Notice updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [notices]
      summary: Delete a notice (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-3:** As a secretary, I want to remove outdated maintenance notices.
        - **US-5:** As a secretary, I want to keep the announcement board clean and relevant.
       
      parameters:
        - { name: notice_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Notice deleted }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/notices/{notice_id}/status:
    patch:
      tags: [notices]
      summary: Activate or deactivate a notice (secretary only)
      parameters:
        - { name: notice_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        '200': { description: Notice status updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── dues ──────────────────────────────────────────────────────
  /api/dues:
    get:
