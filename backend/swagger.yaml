  /api/dues/reminder:
    post:
      tags: [dues]
      summary: Send a payment reminder to residents with pending dues (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-14:** As a secretary, I want to send maintenance fee reminders to all residents in one action so that I do not have to manually post reminder messages every month.
       
      responses:
        '200': { description: Reminders sent }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── emergency ─────────────────────────────────────────────────
  /api/emergency/{alert_id}:
    get:
      tags: [emergency]
      summary: Get a single emergency alert
      parameters:
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Alert detail }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/emergency:
    get:
      tags: [emergency]
      summary: List emergency alerts (residents see Public only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-9:** As a resident, I want to see active emergency alerts in the app.
        - **US-16:** As a secretary, I want to view all emergency alerts sent across the society.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of alerts }
    post:
      tags: [emergency]
      summary: Create an emergency alert (any authenticated role)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-9:** As a resident, I want to send a one-tap emergency alert (theft, fire, etc.) to the secretary and security so that I am not solely dependent on manually calling during a crisis.
        - **US-16:** As a secretary, I want to send a single emergency alert to all residents at once so that I do not have to call each resident individually.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                type: { type: string, enum: [Public, Private], default: Public }
                location_info: { type: string }
                severity: { type: string, enum: [low, medium, high, critical] }
      responses:
        '201': { description: Alert created }
        '400': { $ref: '#/components/responses/BadRequest' }


  /api/emergency/{alert_id}/resolve:
    patch:
      tags: [emergency]
      summary: Resolve an emergency alert (secretary or security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-9:** As a resident, I want to know when an emergency is resolved.
        - **US-16:** As a secretary, I want to resolve an emergency alert once the situation is handled so that residents know it is no longer active.
       
      parameters:
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Alert resolved }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── visitors ──────────────────────────────────────────────────
  /api/visitors:
    get:
      tags: [visitors]
      summary: List visitors (resident sees own, secretary/security see all)
      description: |
        Resident-scoped history the frontend can use to prefill a repeat
        visitor's name/flat/reason (US-24) — there is no dedicated
        autofill/lookup endpoint, this list is the closest available
        support for that story.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want to view my pre-registered visitors and their gate pass status.
        - **US-24 (partial):** As a visitor, I want the system to remember my details from a previous visit so that I do not have to enter the same name, flat number, and reason every time.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of visitors }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [visitors]
      summary: Pre-register a visitor (resident only)
      description: |
        US-22 (uploading ID proof digitally before arrival) is a known
        gap: the Visitor model only stores an id_verified boolean, with
        no upload field or endpoint for the document itself. Verification
        currently happens visually at the gate, not via an uploaded ID.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want to pre-register an expected guest (name and flat number) before they arrive so that the security guard can verify them at the gate without me taking a phone call every time.
        - **US-21:** As a visitor, I want to pre-register my visit in advance with date and time so that I do not have to wait at the gate for the resident to pick up a call.
        - **US-22 (not implemented):** As a visitor, I want to upload my ID proof digitally before arrival — not built; see description above.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string }
                expected_date: { type: string, format: date }
                expected_time: { type: string, example: "14:30" }
                vehicle_number: { type: string }
                reason: { type: string }
      responses:
        '201': { description: Visitor pre-registered, pass_code returned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/today:
    get:
      tags: [visitors]
      summary: List today's expected/checked-in visitors (secretary/security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a security guard, I want to see today's expected visitors so that I can verify them efficiently at the gate.
       
      responses:
        '200': { description: Today's visitors }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/inside:
    get:
      tags: [visitors]
      summary: List visitors currently checked in (security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a security guard, I want to see who is currently inside the society so that I have an accurate live count at all times.
       
      responses:
        '200': { description: Visitors currently on premises }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/gate-request:
    post:
      tags: [visitors]
      summary: Flag an unregistered walk-in visitor and request resident approval (security only)
      description: |
        For a visitor who shows up without having been pre-registered.
        Creates the visitor record in awaiting_approval status against
        today's date; the resident then approves or denies it.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want an unexpected visitor at the gate to be routed to me for approval instead of the guard letting them in unchecked.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, resident_id]
              properties:
                name: { type: string }
                resident_id: { type: string }
                phone: { type: string }
                reason: { type: string }
                vehicle_number: { type: string }
      responses:
        '201': { description: Gate request sent to resident }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/{visitor_id}/approve:
    patch:
      tags: [visitors]
      summary: Approve a gate request (resident only)
      description: |
        Activates a 15-minute walk-in pass immediately; security still
        checks the visitor in via the existing checkin route. The
        visitor's flat/block details (from visitor_to_dict) are returned
        in the response, satisfying US-25.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want to approve or deny an unexpected visitor at the gate from my phone.
        - **US-25:** As a visitor, I want to receive the flat and block details once my visit is approved so that I can find the resident without confusion.
       
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Gate request approved, pass active }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/visitors/{visitor_id}/deny:
    patch:
      tags: [visitors]
      summary: Deny a gate request (resident only)
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Gate request denied, entry rejected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/visitors/verify:
    patch:
      tags: [visitors]
      summary: Verify a visitor pass code (security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want to pre-register an expected guest so that the security guard can verify them at the gate without me taking a phone call every time.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pass_code]
              properties: { pass_code: { type: string } }
      responses:
        '200': { description: Pass code verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Invalid or expired pass code }


  /api/visitors/{visitor_id}/checkin:
    patch:
      tags: [visitors]
      summary: Check in a visitor (security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want my guest to be verified smoothly at the gate.
        - **US-23:** As a visitor, I want the resident to be automatically notified when I arrive so that I do not have to call them manually.
       
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Visitor checked in }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/{visitor_id}/checkout:
    patch:
      tags: [visitors]
      summary: Check out a visitor (security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-26:** As a visitor, I want a simple checkout process when I leave the society so that my exit is properly recorded instead of only my entry.
       
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Visitor checked out }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/{visitor_id}/reject:
    patch:
      tags: [visitors]
      summary: Reject a visitor's entry (security only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want the security guard to be able to reject unauthorised visitors at the gate.
       
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Visitor entry rejected }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/visitors/{visitor_id}/revoke:
    patch:
      tags: [visitors]
      summary: Revoke a pre-registered pass before the visit (resident only)
      description: |
        Only an upcoming (pre_registered) pass can be revoked — this is
        for cancelling a guest you've already pre-registered.
      parameters:
        - { name: visitor_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Pass revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ── amenities ─────────────────────────────────────────────────
  /api/amenities:
    get:
      tags: [amenities]
      summary: List all amenities
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-2:** As a resident, I want to book common areas (hall, parking, etc.) online so that I do not have to visit the office or wait for the secretary.
       
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [exclusive, public, unbookable] } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of amenities }
    post:
      tags: [amenities]
      summary: Add an amenity (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-2:** As a secretary, I want to manage bookable amenities so that residents can reserve them online without visiting the office.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [exclusive, public, unbookable] }
                booking_type: { type: string, enum: [automatic, approval_required] }
                description: { type: string }
                icon: { type: string }
                location: { type: string }
                capacity: { type: integer }
                is_air_conditioned: { type: boolean }
                is_decoratable: { type: boolean }
                features: { type: array, items: { type: string } }
                special_booking: { type: boolean }
                pricing:
                  type: object
                  properties:
                    type: { type: string, enum: [hourly, daily] }
                    rate: { type: number }
                    min_units: { type: integer }
                    unit_label: { type: string }
      responses:
        '201': { description: Amenity added }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/amenities/recommend:
    post:
      tags: [amenities]
      summary: AI-based amenity recommendation from a free-text query
      description: |
        Advisory only. Returns a friendly, non-JSON text recommendation
        drawn from the society's current amenity list, generated by an
        LLM call; not persisted anywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200':
          description: Recommendation text
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendation: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }


  /api/amenities/{amenity_id}:
    patch:
      tags: [amenities]
      summary: Edit amenity fields (secretary only)
      parameters:
        - { name: amenity_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Amenity updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [amenities]
      summary: Delete an amenity (secretary only) — blocked if active bookings exist
      parameters:
        - { name: amenity_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Amenity deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }


  /api/amenities/{amenity_id}/status:
    patch:
      tags: [amenities]
      summary: Update amenity status — available/booked/closed/maintenance/inactive (secretary only)
      parameters:
        - { name: amenity_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [available, booked, closed, maintenance, inactive] }
                status_until: { type: string, format: date }
      responses:
        '200': { description: Status updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/amenities/{amenity_id}/availability:
    get:
      tags: [amenities]
      summary: Privacy-safe availability check for a date/time range
      parameters:
        - { name: amenity_id, in: path, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: end_date, in: query, schema: { type: string, format: date } }
        - { name: start_time, in: query, schema: { type: string, example: "18:00" } }
        - { name: end_time, in: query, schema: { type: string, example: "20:00" } }
      responses:
        '200': { description: "{ available: bool, message: string }" }
        '400': { $ref: '#/components/responses/BadRequest' }


  /api/amenities/{amenity_id}/book:
    post:
      tags: [amenities]
      summary: Book an amenity (resident only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-2:** As a resident, I want to book common areas (hall, parking, etc.) online so that I do not have to visit the office multiple times or wait for the secretary to pick the call up.
       
      parameters:
        - { name: amenity_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                end_date: { type: string, format: date }
                start_time: { type: string, example: "18:00" }
                end_time: { type: string, example: "21:00" }
