  # ── service-requests (Home Services) ─────────────────────────
  /api/service-requests/suggest-category:
    post:
      tags: [service-requests]
      summary: Live AI category suggestion while describing a service request (resident only)
      description: |
        Explicitly triggered by a button in the UI (not called as-you-type,
        to avoid guessing from half-typed text and to avoid the suggestion
        flickering as someone pauses mid-sentence). Doesn't persist
        anything — purely advisory for pre-filling the category field.
        Returns category: null if no OPENROUTER_API_KEY is configured, the
        call fails, or the description is empty.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-7:** As a resident, I want to raise a service request and get an AI-suggested category so I can select the correct vendor type quickly.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
      responses:
        '200':
          description: Suggested category (nullable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  category: { type: string, enum: [plumber, electrician, carpenter, cleaner, other], nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/service-requests:
    post:
      tags: [service-requests]
      summary: Book a home service with a vendor (resident only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-7:** As a resident, I want to raise an electrician or plumber request in the app and see which worker is assigned, their contact details, and when the job is completed so that I do not have to call multiple times.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description, vendor_id, scheduled_date, scheduled_time]
              properties:
                category: { type: string, enum: [plumber, electrician, carpenter, cleaner, other] }
                description: { type: string }
                vendor_id: { type: string }
                scheduled_date: { type: string, format: date }
                scheduled_time: { type: string, example: "11:00" }
      responses:
        '201': { description: Service booked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [service-requests]
      summary: List the current resident's home service requests
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-7:** As a resident, I want to track my service requests and see which vendor is assigned.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of service requests }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/service-requests/{request_id}:
    patch:
      tags: [service-requests]
      summary: Reschedule a scheduled service request
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { type: string }
                description: { type: string }
                vendor_id: { type: string }
                scheduled_date: { type: string, format: date }
                scheduled_time: { type: string }
      responses:
        '200': { description: Request rescheduled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/service-requests/{request_id}/cancel:
    patch:
      tags: [service-requests]
      summary: Cancel a scheduled service request
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-7:** As a resident, I want to cancel a service request if the issue is resolved or no longer needed.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Request cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/service-requests/{request_id}/complete:
    patch:
      tags: [service-requests]
      summary: Mark a service request complete and record vendor payment
      description: |
        Also sends the vendor a Telegram completion + payment confirmation
        message (added Sprint 1), doubling as the record referenced in
        US-20 — there is no separate itemized invoice document generated.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-7:** As a resident, I want to see when a job is completed.
        - **US-19:** As a plumber, I want to receive a Telegram notification when the resident marks the complaint as completed so that I know the job has been officially closed.
        - **US-20:** As a plumber, I want to receive a digital invoice and payment confirmation through Telegram once the resident completes payment so that I have a formal record of completed and paid work.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties: { amount: { type: number } }
      responses:
        '200': { description: Marked complete and paid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/service-requests/{request_id}/rate:
    patch:
      tags: [service-requests]
      summary: Rate a completed service request
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties: { rating: { type: integer, minimum: 1, maximum: 5 } }
      responses:
        '200': { description: Rating recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── electricity-bills ─────────────────────────────────────────
  /api/electricity-bills:
    get:
      tags: [electricity-bills]
      summary: List all posted electricity bills (secretary only)
      responses:
        '200': { description: List of bills }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [electricity-bills]
      summary: Post the month's electricity bill (secretary only)
      description: |
        Automatically runs an AI usage-analysis comparison against the 3
        most recent other bills on record (by month, not upload order)
        and stores the result on ai_analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, total_units, total_amount]
              properties:
                month: { type: string, description: "'YYYY-MM' or 'YYYY-MM-DD'" }
                total_units: { type: number }
                total_amount: { type: number }
      responses:
        '201': { description: Bill posted (with computed AI usage analysis) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/electricity-bills/{bill_id}/retry-analysis:
    post:
      tags: [electricity-bills]
      summary: Retry generating the AI usage analysis for a bill (secretary only)
      description: |
        No-op if ai_analysis is already stored — returns it as-is instead
        of regenerating. Otherwise re-runs the comparison against the 3
        most recent other bills on record.
      parameters:
        - { name: bill_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Analysis generated (or already available / still unavailable) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/electricity-bills/{bill_id}/analysis:
    get:
      tags: [electricity-bills]
      summary: Get the stored AI usage analysis for a bill (secretary only)
      parameters:
        - { name: bill_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Stored AI analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai_analysis: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  # ── funds ─────────────────────────────────────────────────────
  /api/funds:
    get:
      tags: [funds]
      summary: List society fund balances (secretary only)
      responses:
        '200': { description: Fund balances and total }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/funds/config:
    get:
      tags: [funds]
      summary: List the fund split configuration (secretary only)
      responses:
        '200': { description: Fund split percentages }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [funds]
      summary: Bulk-update the fund split configuration in one call (secretary only)
      description: |
        Updates several fund configs at once. The full resulting set of
        active percentages (across configs you're updating and configs
        you're not) must sum to exactly 100, or the whole request is
        rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configs]
              properties:
                configs:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                      percentage: { type: number }
                      is_active: { type: boolean }
      responses:
        '200': { description: Configuration updated }
        '400': { description: "Missing configs, unknown config id, invalid percentage, or active percentages don't sum to 100" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/funds/config/{config_id}:
    patch:
      tags: [funds]
      summary: Edit a fund's split percentage — active percentages must sum to 100 (secretary only)
      parameters:
        - { name: config_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                percentage: { type: number }
                is_active: { type: boolean }
      responses:
        '200': { description: Configuration updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/funds/transactions:
    get:
      tags: [funds]
      summary: List fund ledger transactions (secretary only)
      parameters:
        - { name: fund_name, in: query, schema: { type: string } }
      responses:
        '200': { description: List of transactions }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [funds]
      summary: Record a manual credit/debit transaction (secretary only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fund_name, type, amount, description]
              properties:
                fund_name: { type: string }
                type: { type: string, enum: [credit, debit] }
                amount: { type: number }
                description: { type: string }
      responses:
        '201': { description: Transaction recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── document-requests ─────────────────────────────────────────
  /api/document-requests:
    post:
      tags: [document-requests]
      summary: Submit a document request (resident only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-4:** As a resident, I want to request society documents (NOC, payment receipts) through the app so that I do not have to visit the office, submit a written letter, and wait days for a signature.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [noc, payment_receipt, other] }
                reason: { type: string }
      responses:
        '201': { description: Request submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [document-requests]
      summary: List document requests (resident sees own, secretary sees all)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-4:** As a resident, I want to track the status of my document request so that I know when it is ready for download.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of requests }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/document-requests/{request_id}/upload:
    patch:
      tags: [document-requests]
      summary: Upload the requested document (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-4:** As a secretary, I want to fulfil resident document requests by uploading the file so that residents can download without visiting the office.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, file_data]
              properties:
                filename: { type: string }
                file_data: { type: string, description: "base64-encoded file" }
      responses:
        '200': { description: Document uploaded and marked ready }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/document-requests/{request_id}/download:
    get:
      tags: [document-requests]
      summary: Download the uploaded document
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-4:** As a resident, I want to request society documents (NOC, payment receipts) through the app so that I do not have to visit the office.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Document file }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/document-requests/{request_id}/deliver:
    patch:
      tags: [document-requests]
      summary: Mark a document request delivered (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-4:** As a secretary, I want to mark document requests as delivered once the resident has received them.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Marked delivered }
        '403': { $ref: '#/components/responses/Forbidden' }


