      summary: List dues (resident sees own, secretary sees all)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-15:** As a secretary, I want to record and view each resident's monthly due status in one place so that I can check who has paid without relying on manual records.
       
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: List of dues }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/dues/resident/{resident_id}:
    get:
      tags: [dues]
      summary: List every monthly due for one resident (own dues, or secretary)
      parameters:
        - { name: resident_id, in: path, required: true, schema: { type: string } }
      responses:
