  /api/dues/{due_id}/receipt:
    get:
      tags: [dues]
      summary: Download the PDF receipt for a paid due
      parameters:
        - { name: due_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: PDF receipt
