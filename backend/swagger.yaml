      responses:
        '200': { description: List of requests }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/profile-requests/{request_id}/approve:
    patch:
      tags: [profile-requests]
      summary: Approve a profile-update request (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-10:** As a secretary, I want to approve resident profile changes so that the society has accurate occupant and contact information.
       
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Request approved and applied }
