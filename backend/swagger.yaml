            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/dues/generate:
    post:
      tags: [dues]
      summary: Generate monthly dues for every resident (secretary only)
      description: |
       
       
        ---
       
        **User Story Mapping**
       
        - **US-15:** As a secretary, I want to generate monthly dues for all residents in one action so that I do not have to create individual records manually.
       
