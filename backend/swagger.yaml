  # ── profile ───────────────────────────────────────────────────
  /api/profile:
    patch:
      tags: [profile]
      summary: Self-service edit of your own profile fields (resident only)
      description: |
        For fields that don't need secretary approval — see
        /api/profile-requests for protected fields that do. Only the
        following fields are accepted: name, phone, occupant_type,
        household_size, vehicle1_name, vehicle1_number, vehicle2_name,
        vehicle2_number. Any other field in the request body is silently
        ignored.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-10:** As a resident, I want to update my flat's occupant details and contact number myself in the app so that I do not have to call the secretary every time someone moves in or out.
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                occupant_type: { type: string }
                household_size: { type: integer }
                vehicle1_name: { type: string }
                vehicle1_number: { type: string }
                vehicle2_name: { type: string }
                vehicle2_number: { type: string }
      responses:
        '200': { description: Profile updated successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── flats ─────────────────────────────────────────────────────
  /api/flats/directory:
    get:
      tags: [flats]
      summary: Flat -> primary resident lookup (secretary/security only)
      description: |
        Returns one primary resident contact per flat (preferring an
        onboarded resident, falling back to whichever resident record
        exists), used by security to raise a gate request against a real
        resident_id. Flats with no resident on record are omitted.
       
       
        ---
       
        **User Story Mapping**
       
        - **US-6:** As a resident, I want an unexpected visitor at the gate to be routed to the right flat/resident without me needing to communicate this in advance.
       
      responses:
        '200':
          description: Flat directory
          content:
            application/json:
              schema:
                type: object
                properties:
                  flats:
                    type: array
                    items:
                      type: object
                      properties:
                        flat_id: { type: string }
                        flat_number: { type: string }
                        tower: { type: string }
                        floor: { type: integer }
                        status: { type: string }
                        resident_id: { type: string }
                        resident_name: { type: string }
                  total: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/flats/blocks:
    get:
      tags: [flats]
      summary: List the society's unique block/tower values
      description: |
        Used to populate the notice 'relevance' dropdown, so stored values
        always match what residents are filtered against
        (resident.flat.tower).
      responses:
        '200':
          description: Block/tower list
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks: { type: array, items: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }


  # ── ai-assistant ──────────────────────────────────────────────
  /api/ai-assistant/chat:
    post:
      tags: [ai-assistant]
      summary: AI navigation/help chatbot
      description: |
        Answers questions about how to use the platform, tailored to the
        logged-in user's own role (current_user.role drives the prompt —
        a client-supplied role is not trusted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '200':
          description: Chatbot reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }